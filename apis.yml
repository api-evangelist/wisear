name: Wisear
description: >-
  Wisear is a Paris-based neurotechnology company building an AI-powered neural
  interface that lets people control devices through voiceless and touchless
  commands. Its technology reads biosignals captured by everyday wearables such
  as wireless earphones, AR/VR headsets and smartglasses, turning subtle facial
  and neural gestures into hands-free device controls. Wisear targets use cases
  across consumer audio, industrial augmented reality, walkie-talkie and
  emergency communications, gaming headsets, the metaverse and accessibility.
  Surfaced as a Techstars portfolio company and added to the API Evangelist
  network; as of this enrichment pass Wisear publishes no public developer API,
  SDK, or documentation portal — this profile captures its public identity and
  domain-security posture.
